<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Company App{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'mycompany:employee_list' %}"
          >Company</a
        >

        <div class="navbar-nav">
          <a class="nav-link" href="{% url 'mycompany:employee_list' %}"
            >Employees</a
          >
          <a class="nav-link" href="{% url 'mycompany:department_list' %}"
            >Departments</a
          >
          <a class="nav-link" href="{% url 'mycompany:project_list' %}"
            >Projects</a
          >
          <a class="nav-link" href="{% url 'mycompany:employee_search' %}"
            >Search</a
          >
        </div>
      </div>
    </nav>

    <div class="container mt-4">{% block content %}{% endblock %}</div>
  </body>
</html>
