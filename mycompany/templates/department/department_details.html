<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Department details</title>
  </head>
  <body>
    <nav><a href="{% url 'mycompany:employee_list' %}">Home</a></nav>
    <table border="1">
      <caption>
        <strong>{{department.department_name}} Details</strong>
      </caption>
      <thead>
        <tr>
          <th>Field</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody>
        {% for key, value in department.as_dict.items %}
        <tr>
          <td><strong>{{ key }}</strong></td>
          <td>{{ value }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
