{% extends "base.html" %} 

{% block title %} Employees {% endblock %} 

{% block content %}

<h2>Employees</h2>

<table class="table table-striped table-hover">
  <thead>
    <tr>
      <th>SSN</th>
      <th>Name</th>
    </tr>
  </thead>

  <tbody>
    {% for employee in employee_list %}
    <tr>
      <td>{{ employee.ssn }}</td>
      <td>
        <a href="{% url 'mycompany:employee_details' employee.ssn %}">
          {{ employee.first_name }} {{ employee.last_name }}
        </a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
